<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | CodeBuddy</title>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme-system.css', v='1.3') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth-theme-switcher.css', v='1.3') }}">
  <style>
    :root {
      --void: #020d12;
      --deep: #060d1a;
      --plasma: #00ffe0;
      --plasma-dim: rgba(0, 255, 224, 0.1);
      --plasma-glow: rgba(0, 255, 224, 0.2);
      --nova: #a855f7;
      --fire: #ff6b2b;
      --text: #e2f4ff;
      --text-2: rgba(226, 244, 255, 0.45);
      --text-3: rgba(226, 244, 255, 0.18);
      --border: rgba(0, 255, 224, 0.08);
      --border-hi: rgba(0, 255, 224, 0.3);
      --surface: rgba(0, 255, 224, 0.03);
      --mono: 'IBM Plex Mono', monospace;
      --display: 'Inter', system-ui, -apple-system, sans-serif;
      --body: 'Inter', system-ui, -apple-system, sans-serif;
      --card-bg: rgba(6, 13, 26, 0.92);
      --logo-bg-outer: rgba(0, 255, 224, 0.03);
      --logo-bg-inner: rgba(6, 13, 26, 0.8);
    }

    body.light {
      --void: #e8f4f8;
      --deep: #d4ecf5;
      --plasma: #0066d6;
      --plasma-dim: rgba(3, 102, 214, 0.15);
      --plasma-glow: rgba(3, 102, 214, 0.3);
      --nova: #5e21b6;
      --fire: #c41e3a;
      --text: #0c2a3a;
      --text-2: rgba(12, 42, 58, 0.65);
      --text-3: rgba(12, 42, 58, 0.45);
      --border: rgba(3, 102, 214, 0.25);
      --border-hi: rgba(3, 102, 214, 0.55);
      --surface: rgba(3, 102, 214, 0.08);
      --card-bg: rgba(255, 255, 255, 0.95);
      --logo-bg-outer: rgba(3, 102, 214, 0.06);
      --logo-bg-inner: #ffffff;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--body);
      background: var(--void);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #neuralCanvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.4;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      opacity: 0.4;
    }

    .forge-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      backdrop-filter: blur(40px) saturate(180%);
      border: 1px solid var(--border-hi);
      border-radius: 2px;
      padding: 42px 40px 36px;
      box-shadow:
        0 0 0 1px rgba(0, 255, 224, 0.04),
        0 24px 80px rgba(0, 0, 0, 0.7),
        0 0 60px rgba(0, 255, 224, 0.06);
    }

    .forge-card::before,
    .forge-card::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: var(--plasma);
      border-style: solid;
      opacity: 0.6;
    }

    .forge-card::before {
      top: -1px;
      left: -1px;
      border-width: 2px 0 0 2px;
    }

    .forge-card::after {
      bottom: -1px;
      right: -1px;
      border-width: 0 2px 2px 0;
    }

    .card-scanline {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--plasma), var(--nova), transparent);
      background-size: 200% 100%;
      animation: scanMove 3s linear infinite;
      border-radius: 2px 2px 0 0;
    }

    @keyframes scanMove {
      0% {
        background-position: 0% 0
      }

      100% {
        background-position: 200% 0
      }
    }

    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .logo-hex {
      width: 56px;
      height: 56px;
      position: relative;
    }

    .logo-hex svg {
      width: 56px;
      height: 56px;
    }

    .logo-hex-inner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      filter: drop-shadow(0 0 10px var(--plasma));
    }

    .logo-title {
      font-family: var(--display);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--plasma);
      text-shadow: 0 0 30px var(--plasma-glow);
    }

    .logo-sub {
      font-family: var(--display);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-3);
      text-align: center;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-hi), transparent);
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 20px;
      position: relative;
    }

    .field-label {
      font-family: var(--display);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 7px;
      display: block;
    }

    .field-wrap {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--surface);
      transition: border-color 0.25s, box-shadow 0.25s;
      overflow: hidden;
    }

    .field-wrap:focus-within {
      border-color: var(--border-hi);
      box-shadow: 0 0 0 1px rgba(0, 255, 224, 0.08), 0 0 20px rgba(0, 255, 224, 0.05);
    }

    .field-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-3);
      font-size: 14px;
      transition: color 0.2s;
      pointer-events: none;
      z-index: 2;
    }

    .field-wrap:focus-within .field-icon {
      color: var(--plasma);
    }

    .field-input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: 0.5px;
    }

    .field-input::placeholder {
      color: var(--text-3);
    }

    .flash-msg {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--fire);
      border: 1px solid rgba(255, 107, 43, 0.25);
      background: rgba(255, 107, 43, 0.08);
      padding: 9px 12px;
      border-radius: 2px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .forge-btn {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border: 1px solid var(--border-hi);
      background: var(--plasma-dim);
      color: var(--plasma);
      font-family: var(--display);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      position: relative;
      overflow: hidden;
      transition: all 0.25s;
      box-shadow: 0 0 12px var(--plasma-glow);
    }

    .forge-btn:hover {
      background: rgba(0, 255, 224, 0.15);
      box-shadow: 0 0 28px var(--plasma), inset 0 0 16px var(--plasma-dim);
      border-color: var(--plasma);
    }

    .forge-btn:active {
      transform: scale(0.98);
    }

    .btn-arrow {
      margin-left: 8px;
      transition: transform 0.2s;
      display: inline-block;
    }

    .forge-btn:hover .btn-arrow {
      transform: translateX(4px);
    }

    .register-row {
      text-align: center;
      margin-top: 22px;
      font-family: var(--display);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-3);
    }

    .register-row a {
      color: var(--plasma);
      text-decoration: none;
      position: relative;
      transition: all 0.2s;
    }

    .register-row a:hover {
      text-shadow: 0 0 10px var(--plasma-glow);
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-family: var(--display);
      font-size: 11px;
      letter-spacing: 1.5px;
      color: var(--text-3);
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--plasma);
      box-shadow: 0 0 5px var(--plasma);
      animation: blink 1.8s ease infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1 }
      50% { opacity: 0.3 }
    }

    @media (max-width: 520px) {
      html, body { height: auto; min-height: 100%; overflow: auto; }
      body { padding: 20px 10px; }
      .forge-card { padding: 30px 20px 24px; margin: 20px auto; }
    }
  </style>
  <script>
    (function(){
      var t = localStorage.getItem('cb-theme') || 'gaming';
      var valid = ['gaming','darkpro','professional','warm','minimal'];
      if(!valid.includes(t)) t = 'gaming';
      document.documentElement.classList.add('theme-' + t);
    })();
  </script>
</head>

<body>
  <script src="{{ url_for('static', filename='js/theme-system.js', v='1.3') }}"></script>
  <script src="{{ url_for('static', filename='js/auth-theme-switcher.js', v='1.3') }}"></script>

  <canvas id="neuralCanvas"></canvas>

  <div class="forge-card">
    <div class="card-scanline"></div>

    <div class="logo-area">
      <div class="logo-hex">
        <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon points="28,3 51,16 51,40 28,53 5,40 5,16" stroke="var(--plasma)" stroke-width="1.5" fill="var(--logo-bg-outer)" />
        </svg>
        <div class="logo-hex-inner">⬡</div>
      </div>
      <div class="logo-title">CODEBUDDY</div>
      <div class="logo-sub">Reset Access Terminal</div>
    </div>

    <div class="divider"></div>

    {% if error %}
    <div class="flash-msg">⚠ {{ error }}</div>
    {% endif %}
    {% if success %}
    <div class="flash-msg" style="color:var(--plasma); border-color:rgba(0,255,224,0.25); background:rgba(0,255,224,0.08);">✓ {{ success }}</div>
    {% endif %}

    <form method="POST">
      <div class="field">
        <label class="field-label">Registered Email</label>
        <div class="field-wrap">
          <span class="field-icon">✉</span>
          <input class="field-input" type="email" name="email" placeholder="Enter your email address" required autocomplete="off">
        </div>
      </div>

      <button type="submit" class="forge-btn">
        SEND RESET LINK <span class="btn-arrow">▶</span>
      </button>
    </form>

    <div class="register-row">
      Remember key? <a href="/login">Login here →</a>
    </div>

    <div class="status-line">
      <div class="status-dot"></div>
      CODEBUDDY · RECOVERY TERMINAL
    </div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('neuralCanvas');
      const ctx = canvas.getContext('2d');
      let W, H, nodes = [];
      function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
      resize(); window.addEventListener('resize', resize);
      class Node {
        constructor() { this.x = Math.random() * W; this.y = Math.random() * H; this.vx = (Math.random() - .5) * .35; this.vy = (Math.random() - .5) * .35; this.r = Math.random() * 1.5 + 0.8; this.p = Math.random() * Math.PI * 2; }
        update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > W) this.vx *= -1; if (this.y < 0 || this.y > H) this.vy *= -1; this.p += 0.02; }
      }
      for (let i = 0; i < 55; i++) nodes.push(new Node());
      let mx = W / 2, my = H / 2;
      document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
      function draw() {
        ctx.clearRect(0, 0, W, H);
        nodes.forEach(n => n.update());
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y, d = Math.sqrt(dx * dx + dy * dy);
            if (d < 130) { ctx.beginPath(); ctx.moveTo(nodes[i].x, nodes[i].y); ctx.lineTo(nodes[j].x, nodes[j].y); ctx.strokeStyle = `rgba(0,255,224,${(1 - d / 130) * .22})`; ctx.lineWidth = .5; ctx.stroke(); }
          }
          const dx = nodes[i].x - mx, dy = nodes[i].y - my, d = Math.sqrt(dx * dx + dy * dy);
          if (d < 200) { ctx.beginPath(); ctx.moveTo(nodes[i].x, nodes[i].y); ctx.lineTo(mx, my); ctx.strokeStyle = `rgba(0,255,224,${(1 - d / 200) * .35})`; ctx.lineWidth = .8; ctx.stroke(); }
        }
        nodes.forEach(n => {
          const g = (Math.sin(n.p) + 1) / 2;
          ctx.beginPath(); ctx.arc(n.x, n.y, n.r * (1 + g * .5), 0, Math.PI * 2);
          ctx.fillStyle = `rgba(0,255,224,${.35 + g * .45})`; ctx.fill();
        });
        requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>
</body>

</html>
